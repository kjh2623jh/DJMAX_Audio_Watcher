name: Build Windows
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Build and package pinned SVCL 1.28
        shell: pwsh
        run: .\package-release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: DJMAX-Audio-Watcher-v5-Windows-x64-SVCL-1.28
          path: release/DJMAX_Audio_Watcher_v5_Windows_x64_SVCL_1.28.zip
          if-no-files-found: error
