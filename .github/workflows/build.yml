name: Build and Release Windows
on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Build Windows package
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Build and package pinned SVCL 1.28
        shell: pwsh
        env:
          APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
        run: .\package-release.ps1 -Version $env:APP_VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: DJMAX-Audio-Watcher-Windows-x64
          path: release/DJMAX_Audio_Watcher_Windows_x64.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: DJMAX-Audio-Watcher-Windows-x64
          path: release
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
          ASSET_PATH: release/DJMAX_Audio_Watcher_Windows_x64.zip
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$ASSET_PATH" --clobber
            if [ "$(gh release view "$TAG_NAME" --json isDraft --jq '.isDraft')" = "true" ]; then
              gh release edit "$TAG_NAME" --draft=false
            fi
          else
            gh release create "$TAG_NAME" "$ASSET_PATH" --verify-tag --generate-notes
          fi
